name: NavaStream Cloudflare Setup and Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navastream-cloudflare-deploy
  cancel-in-progress: false

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Find or create D1 database and configure Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          database_name = "navastream-db"
          base = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database"

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors="replace")
                  raise RuntimeError(f"Cloudflare API returned HTTP {error.code}: {detail}")
              if not result.get("success"):
                  raise RuntimeError("Cloudflare API error: " + json.dumps(result.get("errors", [])))
              return result.get("result")

          query = urllib.parse.urlencode({"name": database_name, "per_page": 100})
          databases = api("GET", f"{base}?{query}") or []
          matches = [item for item in databases if item.get("name") == database_name]

          if matches:
              database_id = matches[0]["uuid"]
              print(f"Found existing D1 database: {database_name}")
          else:
              created = api("POST", base, {"name": database_name})
              database_id = created["uuid"]
              print(f"Created D1 database: {database_name}")

          if not re.fullmatch(r"[0-9a-fA-F-]{20,}", database_id):
              raise RuntimeError("Cloudflare returned an invalid D1 database ID.")

          config = Path("wrangler.toml")
          text = config.read_text()
          text = text.replace("REPLACE_WITH_D1_DATABASE_ID", database_id)
          text = re.sub(
              r'(?m)^database_id\s*=\s*".*"$',
              f'database_id = "{database_id}"',
              text,
          )
          config.write_text(text)

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"NAVASTREAM_D1_ID={database_id}\n")
          print("Wrangler configuration prepared.")
          PY

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply navastream-db --remote

      - name: Deploy NavaStream API Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy-output.txt
          WORKER_URL="$(grep -Eo 'https://navastream-api\.[a-zA-Z0-9-]+\.workers\.dev' deploy-output.txt | tail -n 1 || true)"
          if [ -n "$WORKER_URL" ]; then
            echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
            echo "Worker URL: $WORKER_URL"
          else
            echo "::warning::Wrangler did not print a workers.dev URL. Check the deployment output and Workers dashboard."
          fi

      - name: Verify deployed API
        if: steps.deploy.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo "Checking $WORKER_URL/health"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$WORKER_URL/health"; then
              echo
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "::error::Worker deployed but health check did not succeed."
          exit 1

      - name: Deployment summary
        if: success()
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## NavaStream Cloudflare deployment"
            echo ""
            echo "- D1 database: `navastream-db` (created or reused)"
            echo "- Migrations: applied"
            echo "- Worker: deployed"
            if [ -n "$WORKER_URL" ]; then
              echo "- API health: $WORKER_URL/health"
              echo "- Tracks endpoint: $WORKER_URL/v1/tracks"
            else
              echo "- Worker URL: see Wrangler deployment output"
            fi
            echo ""
            echo "The D1 schema is ready. Existing SQLite tracks still need a separate import/sync step."
          } >> "$GITHUB_STEP_SUMMARY"
