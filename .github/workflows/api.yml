name: NavaStream API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile application
        run: python -m compileall -q app scripts tests

      - name: Run parser tests
        run: pytest -q

      - name: Validate Cloudflare Worker JavaScript
        run: node --check cloudflare/src/index.js

      - name: Validate D1 migration sequence
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("cloudflare/migrations").glob("*.sql")):
              db.executescript(migration.read_text())
              print(f"Applied in-memory: {migration.name}")
          tables = {
              row[0]
              for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type = 'table'"
              )
          }
          required = {
              "tracks", "catalog_tracks", "catalog_artists",
              "catalog_track_artists", "catalog_albums",
              "catalog_artist_albums",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing tables after migrations: {sorted(missing)}")
          print("All D1 migrations applied successfully in SQLite.")
          PY
