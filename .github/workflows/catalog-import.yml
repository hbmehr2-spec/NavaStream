name: NavaStream Musics-fa Catalog Import

on:
  workflow_dispatch:
    inputs:
      target_tracks:
        description: Number of tracks to collect and store
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: navastream-catalog-import
  cancel-in-progress: false

jobs:
  crawl-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAVASTREAM_CRAWL_LIMIT: ${{ inputs.target_tracks }}
      NAVASTREAM_INGEST_SECRET: ${{ secrets.NAVASTREAM_INGEST_SECRET }}
      NAVASTREAM_API_URL: https://navastream-api.hb-mehr2.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize catalog and crawl Musics-fa
        run: |
          python - <<'PY'
          import asyncio
          from app.database import init_db
          from app.crawler import crawl_all_sources

          async def main():
              await init_db()
              results = await crawl_all_sources()
              print("Crawler results:", results)

          asyncio.run(main())
          PY

      - name: Import catalog into NavaStream server
        run: python scripts/sync_catalog_to_cloudflare.py --limit "$NAVASTREAM_CRAWL_LIMIT"

      - name: Verify server catalog
        run: |
          curl --fail --silent --show-error "$NAVASTREAM_API_URL/health"
          echo
          curl --fail --silent --show-error "$NAVASTREAM_API_URL/v1/tracks?limit=1"
          echo
